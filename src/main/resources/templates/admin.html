<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Administração')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><div class="page-heading"><div><p class="eyebrow">Administração</p><h1>Contas e unidades</h1><p class="muted">Consulte os acessos cadastrados para a equipe.</p></div></div>
<section class="panel records-panel"><div class="section-heading"><h2>Usuários cadastrados</h2></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Unidade</th><th>Situação</th></tr></thead><tbody><tr th:each="u : ${usuarios}"><td data-label="Nome" th:text="${u.nome}"></td><td data-label="E-mail" th:text="${u.email}"></td><td data-label="Perfil" th:text="${u.perfil.descricao}"></td><td data-label="Unidade" th:text="${u.unidade == null ? '—' : u.unidade.nome}"></td><td data-label="Situação" th:text="${u.ativo ? 'Ativo' : 'Inativo'}"></td></tr></tbody></table></div></section>
<section class="panel records-panel"><div class="section-heading"><h2>Unidades</h2></div><ul class="unit-list"><li th:each="u : ${unidades}"><strong th:text="${u.nome}"></strong><span class="badge" th:text="${u.ativa ? 'Ativa' : 'Inativa'}"></span></li></ul></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
