<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Lançamentos')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container">
  <div class="page-heading"><div><p class="eyebrow">Acompanhamento diário</p><h1 th:text="${registroProducao ? 'Meus registros' : 'Lançamentos de produção'}"></h1><p class="muted" th:text="${registroProducao ? 'Confira o que você registrou e corrija enquanto estiver pendente.' : 'Confira os valores antes de liberar os registros para os indicadores.'}"></p></div>
    <div class="actions" th:if="${registroProducao}"><a class="button primary" th:href="@{/producao/maromba}"><span aria-hidden="true">+</span> Maromba</a><a class="button primary" th:href="@{/producao/enforna/nova}"><span aria-hidden="true">+</span> Enforna</a><a class="button primary" th:href="@{/producao/desenforna/nova}"><span aria-hidden="true">+</span> Desenforna</a></div>
  </div>
  <div class="notice success" role="status" th:if="${param.salvo}"><strong>Registrado com sucesso.</strong> <span th:text="${param.salvo[0] + ' registros foram criados, um para cada formato com produção.'}"></span></div>
  <div class="notice success" role="status" th:if="${sucesso}" th:text="${sucesso}"></div><div class="notice error" role="alert" th:if="${falha}" th:text="${falha}"></div>
  <section class="panel"><form method="get" th:action="@{/producao}" class="filters">
    <label>De<input type="date" name="inicio" th:value="${inicio}" required></label><label>Até<input type="date" name="fim" th:value="${fim}" required></label>
    <label>Etapa<select name="etapa"><option value="">Todas</option><option value="MAROMBA" th:selected="${etapa == 'MAROMBA'}">Maromba</option><option value="ENFORNA" th:selected="${etapa == 'ENFORNA'}">Enforna</option><option value="DESENFORNA" th:selected="${etapa == 'DESENFORNA'}">Desenforna</option></select></label>
    <label>Situação<select name="situacao"><option value="">Todas</option><option value="PENDENTE" th:selected="${situacao != null and situacao.name() == 'PENDENTE'}">Pendentes</option><option value="VALIDADO" th:selected="${situacao != null and situacao.name() == 'VALIDADO'}">Validados</option><option value="CANCELADO" th:selected="${situacao != null and situacao.name() == 'CANCELADO'}">Cancelados</option></select></label>
    <button type="submit" class="button secondary">Aplicar filtros</button>
  </form></section>
  <section class="panel records-panel" aria-labelledby="records-title"><div class="section-heading"><h2 id="records-title">Produção registrada</h2><span class="counter" th:text="${registros.totalElements + ' registro(s)'}"></span></div>
    <div th:if="${registros.empty}" class="empty-state"><span class="empty-mark" aria-hidden="true">▤</span><h3>Nenhum registro neste período</h3><p th:text="${registroProducao ? 'Registre a Maromba, a Enforna ou a Desenforna pelos botões acima.' : 'Os lançamentos aparecerão aqui quando forem registrados.'}"></p></div>
    <form th:unless="${registros.empty}" method="post" th:action="@{/producao/validar-lote}" id="lote-form">
      <div class="lote-bar" th:if="${podeValidarLote}"><label class="check"><input type="checkbox" id="marcar-todos"> Marcar todos os pendentes desta página</label><button type="submit" class="button primary">Validar selecionados</button></div>
      <div class="table-wrap"><table><thead><tr><th th:if="${podeValidarLote}"><span class="sr-only">Selecionar</span></th><th>Data / unidade</th><th>Etapa</th><th>Formato</th><th>Valores</th><th>Situação</th><th><span class="sr-only">Ação</span></th></tr></thead><tbody>
        <tr th:each="l : ${registros.content}">
          <td th:if="${podeValidarLote}"><input th:if="${l.situacao.name() == 'PENDENTE'}" type="checkbox" name="ids" th:value="${l.chave}" data-lote th:attr="aria-label=${'Selecionar ' + l.etapa + ' ' + l.formato + ' de ' + fmt.data(l.data)}"></td>
          <td data-label="Data / unidade"><strong th:text="${fmt.data(l.data)}"></strong><small th:text="${l.unidade}"></small></td>
          <td data-label="Etapa"><span th:text="${l.etapa}"></span><small th:if="${l.fornada != null}" th:text="${l.fornada}"></small></td>
          <td data-label="Formato" th:text="${l.formato}"></td><td data-label="Valores" th:text="${l.resumo}"></td>
          <td data-label="Situação"><span class="badge" th:classappend="${l.situacao.name() == 'PENDENTE' ? 'pending' : (l.situacao.name() == 'VALIDADO' ? 'validated' : '')}" th:text="${l.situacao.descricao}"></span></td>
          <td><a class="button quiet" th:href="@{${l.url}}">Abrir <span aria-hidden="true">→</span></a></td></tr>
      </tbody></table></div>
    </form>
    <div class="pagination" th:if="${registros.totalPages > 1}"><a class="button secondary" th:if="${registros.hasPrevious()}" th:href="@{/producao(inicio=${inicio},fim=${fim},situacao=${situacao},etapa=${etapa},pagina=${registros.number - 1})}">Anterior</a><span th:text="${'Página ' + (registros.number + 1) + ' de ' + registros.totalPages}"></span><a class="button secondary" th:if="${registros.hasNext()}" th:href="@{/producao(inicio=${inicio},fim=${fim},situacao=${situacao},etapa=${etapa},pagina=${registros.number + 1})}">Próxima</a></div>
  </section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
