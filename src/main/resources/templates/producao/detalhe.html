<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Conferir registro')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main class="container narrow">
  <a class="back-link" th:href="@{/producao}">← Voltar aos registros</a>
  <div class="notice success" role="status" th:if="${param.salvo}"><strong>Registrado com sucesso.</strong> Os dados estão salvos e podem ser conferidos abaixo.</div>
  <div class="notice success" role="status" th:if="${sucesso}" th:text="${sucesso}"></div><div class="notice error" role="alert" th:if="${falha}" th:text="${falha}"></div>
  <div class="page-heading"><div><p class="eyebrow" th:text="${registro.unidade.nome}"></p><h1>Maromba <span class="title-date" th:text="${fmt.data(registro.dataProducao)}"></span></h1></div><span class="badge" th:classappend="${registro.situacao.name() == 'PENDENTE' ? 'pending' : 'validated'}" th:text="${registro.situacao.descricao}"></span></div>
  <section class="panel form-panel"><div class="quantity-grid"><div class="quantity-result"><span>6 furos</span><strong th:text="${fmt.inteiro(registro.quantidade6f)}"></strong><small>tijolos</small></div><div class="quantity-result"><span>8 furos</span><strong th:text="${fmt.inteiro(registro.quantidade8f)}"></strong><small>tijolos</small></div></div>
    <div class="record-meta"><p>Registrado por <strong th:text="${registro.autor.nome}"></strong><br><span th:text="${fmt.horario(registro.criadoEm)}"></span></p><p th:if="${registro.validador != null}">Validado por <strong th:text="${registro.validador.nome}"></strong><br><span th:text="${fmt.horario(registro.validadoEm)}"></span></p></div>
    <div class="actions"><form th:if="${podeValidar}" th:action="@{/producao/{id}/validar(id=${registro.id})}" method="post"><input type="hidden" name="versao" th:value="${registro.versao}"><button class="button primary" type="submit">Conferi os valores, validar</button></form><a th:if="${podeEditar}" class="button secondary" th:href="@{/producao/{id}/editar(id=${registro.id})}">Corrigir registro</a></div>
  </section>
  <section class="panel form-panel"><p class="eyebrow">Rastreabilidade</p><h2>Histórico do lançamento</h2><ol class="timeline"><li th:each="evento : ${historico}"><strong th:text="${evento.acao}"></strong><p class="muted"><span th:text="${evento.usuario.nome}"></span> · <span th:text="${fmt.horario(evento.ocorridoEm)}"></span></p><p th:if="${evento.valorAnterior != null}"><b>Antes:</b> <span th:text="${evento.valorAnterior}"></span></p><p><b th:text="${evento.valorAnterior == null ? 'Valores:' : 'Depois:'}"></b> <span th:text="${evento.valorNovo}"></span></p></li></ol></section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
