<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1448px;height:662px;background:#FFFFFF;" width="1448px" height="662px" viewBox="0 0 1448 662" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="6"><text x="599.563" y="23.132" fill="#000" font-size="14" textLength="241.938" font-weight="700" font-family="Arial">Estados — lançamento de produção</text></g><g class="entity" data-qualified-name="Pendente" id="ent0001" data-source-line="8"><rect x="209.054" y="157.099" width="495.509" height="64.846" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="209.054" y1="182.047" x2="704.564" y2="182.047" style="stroke:#181818;stroke-width:0.5;"/><text x="428.978" y="174.292" fill="#000" font-size="13" textLength="55.663" font-family="Arial">Pendente</text><text x="214.054" y="199.241" fill="#000" font-size="13" textLength="475.509" font-family="Arial">Registro de Produção pode editar e cancelar os próprios registros da sua unidade.</text><text x="214.054" y="214.19" fill="#000" font-size="13" textLength="427.039" font-family="Arial">Não integra indicadores oficiais nem o movimento do pátio (RN04, RN19).</text></g><g class="entity" data-qualified-name="Validado" id="ent0002" data-source-line="9"><rect x="782.054" y="331.099" width="361.783" height="64.846" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="782.054" y1="356.047" x2="1143.838" y2="356.047" style="stroke:#181818;stroke-width:0.5;"/><text x="937.647" y="348.292" fill="#000" font-size="13" textLength="50.597" font-family="Arial">Validado</text><text x="787.054" y="373.241" fill="#000" font-size="13" textLength="300.593" font-family="Arial">Registro de Produção consulta, sem edição (RN11).</text><text x="787.054" y="388.19" fill="#000" font-size="13" textLength="341.783" font-family="Arial">Integra indicadores oficiais e o movimento do pátio (RN19).</text></g><g class="entity" data-qualified-name="Cancelado" id="ent0003" data-source-line="10"><rect x="136.054" y="505.099" width="371.901" height="79.795" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="136.054" y1="530.047" x2="507.956" y2="530.047" style="stroke:#181818;stroke-width:0.5;"/><text x="290.927" y="522.292" fill="#000" font-size="13" textLength="62.156" font-family="Arial">Cancelado</text><text x="141.054" y="547.241" fill="#000" font-size="13" textLength="289.79" font-family="Arial">Estado final; permanece para consulta e auditoria.</text><text x="141.054" y="562.19" fill="#000" font-size="13" textLength="297.724" font-family="Arial">Não integra indicadores nem o movimento do pátio.</text><text x="141.054" y="577.139" fill="#000" font-size="13" textLength="351.901" font-family="Arial">Não bloqueia novo lançamento com a mesma chave (RN09).</text></g><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="12"><ellipse cx="827.054" cy="59.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0012" data-source-line="19"><ellipse cx="322.054" cy="633.099" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="322.054" cy="633.099" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="30"><path d="M825.554,525.099 L825.554,564.996 A0,0 0 0 0 825.554,564.996 L1100.226,564.996 A0,0 0 0 0 1100.226,564.996 L1100.226,535.099 L1090.226,525.099 L967.054,525.099 L963.054,396.276 L959.054,525.099 L825.554,525.099 A0,0 0 0 0 825.554,525.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1090.226,525.099 L1090.226,535.099 L1100.226,535.099 L1090.226,525.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="831.554" y="542.292" fill="#000" font-size="13" textLength="242.811" font-family="Arial">A correção de Validado mantém o estado.</text><text x="831.554" y="557.241" fill="#000" font-size="13" textLength="253.671" font-family="Arial">Não há transição de retorno para Pendente.</text></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="35"><path d="M338.054,306.099 L338.054,420.74 A0,0 0 0 0 338.054,420.74 L764.486,420.74 A0,0 0 0 0 764.486,420.74 L764.486,316.099 L754.486,306.099 L524.041,306.099 L474.295,222.146 L516.041,306.099 L338.054,306.099 A0,0 0 0 0 338.054,306.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M754.486,306.099 L754.486,316.099 L764.486,316.099 L754.486,306.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="344.054" y="323.292" fill="#000" font-size="13" textLength="364.946" font-family="Arial">Cada alteração usa versão/bloqueio e transação com auditoria.</text><text x="344.054" y="338.241" fill="#000" font-size="13" textLength="405.431" font-family="Arial">Falha de persistência ou operação negada preserva o estado anterior.</text><text x="344.054" y="353.19" fill="#000" font-size="13" textLength="340.342" font-family="Arial">Cancelar o formulário antes de salvar não cria lançamento.</text><text x="344.054" y="368.139" fill="#000" font-size="13" textLength="325.159" font-family="Arial">Correção: lançamento existe, mas o número está errado</text><text x="344.054" y="383.087" fill="#000" font-size="13" textLength="341.098" font-family="Arial">(contagem ou digitação). Cancelamento: o lançamento não</text><text x="344.054" y="398.036" fill="#000" font-size="13" textLength="330.979" font-family="Arial">deveria existir (duplicado, data, etapa ou fornada errada).</text><text x="344.054" y="412.985" fill="#000" font-size="13" textLength="229.76" font-family="Arial">Listas de motivos configuráveis (RN13).</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-link-type="dependency"><polygon points="546.442,157.098,556.258,157.899,551.16,155.446,553.614,150.348,546.442,157.098" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M816.89,65.341 C800.339,70.637 766.55,81.513 738.054,91.099 C673.816,112.707 606.304,136.134 551.16,155.446" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="835.095" y="105.292" fill="#000" font-size="13" textLength="111.268" font-family="Arial">registro confirmado</text><text x="740.054" y="120.241" fill="#000" font-size="13" textLength="301.349" font-family="Arial">[Registro de Produção autorizado; regras atendidas]</text><text x="813.77" y="135.19" fill="#000" font-size="13" textLength="153.918" font-family="Arial">/ gravar original e auditoria</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="1009.643,330.879,1019.044,327.943,1013.399,327.578,1013.763,321.933,1009.643,330.879" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M837.308,61.793 C876.461,60.866 1015.715,59.843 1043.054,91.099 C1100.699,157 1077.994,207.817 1043.054,288.099 C1035.859,304.631 1026.744,315.852 1013.399,327.578" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1131.702" y="179.792" fill="#000" font-size="13" textLength="135.827" font-family="Arial">importar carga histórica</text><text x="1088.69" y="194.741" fill="#000" font-size="13" textLength="221.851" font-family="Arial">[Administrador; a partir de 13/08/2026]</text><text x="1080.054" y="209.69" fill="#000" font-size="13" textLength="239.123" font-family="Arial">/ origem IMPORTADO e auditoria (RN22)</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk7" data-link-type="dependency"><polygon points="705.087,198.255,714.683,200.472,709.996,197.305,713.163,192.618,705.087,198.255" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M705.087,180.942 C716.424,183.136 723.054,186.021 723.054,189.599 C723.054,193.176 721.333,195.111 709.996,197.305" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="852.246" y="172.292" fill="#000" font-size="13" textLength="39.724" font-family="Arial">corrigir</text><text x="725.054" y="187.241" fill="#000" font-size="13" textLength="294.106" font-family="Arial">[autor da mesma unidade OU Gestor de Produção;</text><text x="797.694" y="202.19" fill="#000" font-size="13" textLength="148.827" font-family="Arial">motivo informado (RN15)]</text><text x="763.35" y="217.139" fill="#000" font-size="13" textLength="217.515" font-family="Arial">/ aplicar regras e auditar antes/depois</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="860.695,331.086,853.305,324.575,855.924,329.589,850.91,332.208,860.695,331.086" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M542.199,222.179 C595.436,241.689 665.533,266.95 728.054,288.099 C771.334,302.738 814.611,316.626 855.924,329.589" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="805.582" y="254.292" fill="#000" font-size="13" textLength="160.405" font-family="Arial">validar, um a um ou em lote</text><text x="730.054" y="269.241" fill="#000" font-size="13" textLength="311.46" font-family="Arial">[Gestor de Produção, todos os dias; regras atendidas]</text><text x="767.283" y="284.19" fill="#000" font-size="13" textLength="237.002" font-family="Arial">/ registrar validador, momento e auditoria</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="1144.23,376.399,1153.965,377.894,1149.055,375.086,1151.863,370.175,1144.23,376.399" fill="#181818" style="stroke:#181818;stroke-width:1;str