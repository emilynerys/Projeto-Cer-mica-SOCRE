<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1237px;height:499px;background:#FFFFFF;" width="1237px" height="499px" viewBox="0 0 1237 499" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="6"><text x="494.334" y="23.132" fill="#000" font-size="14" textLength="241.938" font-weight="700" font-family="Arial">Estados — lançamento de produção</text></g><g class="entity" data-qualified-name="Pendente" id="ent0001" data-source-line="8"><rect x="547.5" y="157.099" width="368.315" height="64.846" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="547.5" y1="182.047" x2="915.815" y2="182.047" style="stroke:#181818;stroke-width:0.5;"/><text x="703.826" y="174.292" fill="#000" font-size="13" textLength="55.663" font-family="Arial">Pendente</text><text x="552.5" y="199.241" fill="#000" font-size="13" textLength="348.315" font-family="Arial">Supervisor pode editar os próprios registros da sua unidade.</text><text x="552.5" y="214.19" fill="#000" font-size="13" textLength="229.772" font-family="Arial">Não integra indicadores oficiais (RN04).</text></g><g class="entity" data-qualified-name="Validado" id="ent0002" data-source-line="9"><rect x="28" y="308.599" width="376.986" height="64.846" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="28" y1="333.547" x2="404.986" y2="333.547" style="stroke:#181818;stroke-width:0.5;"/><text x="191.194" y="325.792" fill="#000" font-size="13" textLength="50.597" font-family="Arial">Validado</text><text x="33" y="350.741" fill="#000" font-size="13" textLength="236.99" font-family="Arial">Supervisor consulta, sem edição (RN11).</text><text x="33" y="365.69" fill="#000" font-size="13" textLength="356.986" font-family="Arial">Integra indicadores oficiais, respeitando etapa e classificação.</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="11"><ellipse cx="731.5" cy="59.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="22"><path d="M6,413.099 L6,482.894 A0,0 0 0 0 6,482.894 L426.68,482.894 A0,0 0 0 0 426.68,482.894 L426.68,423.099 L416.68,413.099 L220.5,413.099 L216.5,373.602 L212.5,413.099 L6,413.099 A0,0 0 0 0 6,413.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M416.68,413.099 L416.68,423.099 L426.68,423.099 L416.68,413.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="430.292" fill="#000" font-size="13" textLength="344.005" font-family="Arial">A correção de Validado mantendo o estado é uma proposta</text><text x="12" y="445.241" fill="#000" font-size="13" textLength="260.876" font-family="Arial">descrita nos pontos em aberto da versão 1.7.</text><text x="12" y="460.19" fill="#000" font-size="13" textLength="386.642" font-family="Arial">Não há transição de retorno para Pendente definida nos requisitos.</text><text x="12" y="475.139" fill="#000" font-size="13" textLength="399.68" font-family="Arial">Cancelado não foi incluído: depende de aprovação de novo requisito.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="29"><path d="M690.5,306.099 L690.5,375.894 A0,0 0 0 0 690.5,375.894 L1116.931,375.894 A0,0 0 0 0 1116.931,375.894 L1116.931,316.099 L1106.931,306.099 L868.08,306.099 L767.977,222.304 L860.08,306.099 L690.5,306.099 A0,0 0 0 0 690.5,306.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1106.931,306.099 L1106.931,316.099 L1116.931,316.099 L1106.931,306.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="696.5" y="323.292" fill="#000" font-size="13" textLength="364.946" font-family="Arial">Cada alteração usa versão/bloqueio e transação com auditoria.</text><text x="696.5" y="338.241" fill="#000" font-size="13" textLength="405.431" font-family="Arial">Falha de persistência ou operação negada preserva o estado anterior.</text><text x="696.5" y="353.19" fill="#000" font-size="13" textLength="399.604" font-family="Arial">Cancelar o formulário antes de salvar não cria um estado Cancelado.</text><text x="696.5" y="368.139" fill="#000" font-size="13" textLength="368.494" font-family="Arial">O registro e seu histórico são preservados, sem exclusão física.</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-link-type="dependency"><polygon points="731.5,156.885,735.5,147.885,731.5,151.885,727.5,147.885,731.5,156.885" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M731.5,73.325 C731.5,91.888 731.5,124.635 731.5,151.885" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="796.739" y="105.292" fill="#000" font-size="13" textLength="111.268" font-family="Arial">registro confirmado</text><text x="733.5" y="120.241" fill="#000" font-size="13" textLength="237.745" font-family="Arial">[Supervisor autorizado; regras atendidas]</text><text x="775.414" y="135.19" fill="#000" font-size="13" textLength="153.918" font-family="Arial">/ gravar original e auditoria</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk5" data-link-type="dependency"><polygon points="915.701,199.205,925.322,201.312,920.599,198.198,923.712,193.475,915.701,199.205" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M915.701,179.993 C926.824,182.278 933.5,185.479 933.5,189.599 C933.5,193.718 931.722,195.914 920.599,198.198" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1062.691" y="179.792" fill="#000" font-size="13" textLength="39.724" font-family="Arial">corrigir</text><text x="935.5" y="194.741" fill="#000" font-size="13" textLength="294.106" font-family="Arial">[autor da mesma unidade OU Gestor de Produção]</text><text x="973.795" y="209.69" fill="#000" font-size="13" textLength="217.515" font-family="Arial">/ aplicar regras e auditar antes/depois</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="dependency"><polygon points="318.037,308.545,327.815,309.724,322.816,307.076,325.464,302.077,318.037,308.545" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M612.084,222.154 C590.554,228.005 568.335,234.15 547.5,240.099 C470.294,262.141 388.19,286.978 322.816,307.076" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="648.854" y="254.292" fill="#000" font-size="13" textLength="38.295" font-family="Arial">validar</text><text x="554.185" y="269.241" fill="#000" font-size="13" textLength="227.633" font-family="Arial">[Gestor de Produção; regras atendidas]</text><text x="549.5" y="284.19" fill="#000" font-size="13" textLength="237.002" font-family="Arial">/ registrar validador, momento e auditoria</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk7" data-link-type="dependency"><polygon points="405.103,347.806,414.579,350.49,410.052,347.098,413.445,342.571,405.103,347.806" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M405.103,334.391 C416.294,335.994 423,338.229 423,341.099 C423,343.968 421.244,345.495 410.052,347.098" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="527.988" y="331.292" fill="#000" font-size="13" textLength="39.724" font-family="Arial">corrigir</text><text x="434.033" y="346.241" fill="#000" font-size="13" textLength="227.633" font-family="Arial">[Gestor de Produção; regras atendidas]</text><text x="425" y="361.19" fill="#000" font-size="13" textLength="245.699" font-family="Arial">/ preservar situação e auditar antes/depois</text></g><?plantuml-src bLJ1JXH14BtFLvISrC0YqSG44n