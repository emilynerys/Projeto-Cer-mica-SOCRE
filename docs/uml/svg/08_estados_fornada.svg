<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:701px;height:544px;background:#FFFFFF;" width="701px" height="544px" viewBox="0 0 701 544" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="6"><text x="248.21" y="23.132" fill="#000" font-size="14" textLength="197.579" font-weight="700" font-family="Arial">Estados — código de fornada</text></g><g class="entity" data-qualified-name="Aberta" id="ent0001" data-source-line="8"><rect x="264" y="157.099" width="298.224" height="64.846" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="264" y1="182.047" x2="562.224" y2="182.047" style="stroke:#181818;stroke-width:0.5;"/><text x="393.961" y="174.292" fill="#000" font-size="13" textLength="38.302" font-family="Arial">Aberta</text><text x="269" y="199.241" fill="#000" font-size="13" textLength="201.633" font-family="Arial">Disponível na lista de sua unidade.</text><text x="269" y="214.19" fill="#000" font-size="13" textLength="278.224" font-family="Arial">Aceita novos vínculos de Enforna e Desenforna.</text></g><g class="entity" data-qualified-name="Fechada" id="ent0002" data-source-line="9"><rect x="59" y="316.099" width="277.956" height="64.846" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="59" y1="341.047" x2="336.956" y2="341.047" style="stroke:#181818;stroke-width:0.5;"/><text x="172.683" y="333.292" fill="#000" font-size="13" textLength="50.591" font-family="Arial">Fechada</text><text x="64" y="358.241" fill="#000" font-size="13" textLength="192.226" font-family="Arial">Indisponível para novos vínculos.</text><text x="64" y="373.19" fill="#000" font-size="13" textLength="257.956" font-family="Arial">Preserva lançamentos e histórico existentes.</text></g><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="11"><ellipse cx="413" cy="59.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="20"><path d="M355,306.099 L355,390.842 A0,0 0 0 0 355,390.842 L685.296,390.842 A0,0 0 0 0 685.296,390.842 L685.296,316.099 L675.296,306.099 L500.252,306.099 L440.363,222.296 L492.252,306.099 L355,306.099 A0,0 0 0 0 355,306.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M675.296,306.099 L675.296,316.099 L685.296,316.099 L675.296,306.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="361" y="323.292" fill="#000" font-size="13" textLength="262.317" font-family="Arial">Proposta: o cadastro já cria a fornada Aberta,</text><text x="361" y="338.241" fill="#000" font-size="13" textLength="274.625" font-family="Arial">conforme o protótipo; não há estado Rascunho.</text><text x="361" y="353.19" fill="#000" font-size="13" textLength="279.646" font-family="Arial">RF26: cadastro/manutenção pelo Administrador.</text><text x="361" y="368.139" fill="#000" font-size="13" textLength="309.296" font-family="Arial">RF34: cadastro e operação pelo Gestor de Produção.</text><text x="361" y="383.087" fill="#000" font-size="13" textLength="278.218" font-family="Arial">Não inferir fechamento a partir das quantidades.</text></g><g class="entity" data-qualified-name="GMN9" id="ent0010" data-source-line="28"><path d="M6,428.099 L6,527.791 A0,0 0 0 0 6,527.791 L389.743,527.791 A0,0 0 0 0 389.743,527.791 L389.743,438.099 L379.743,428.099 L202,428.099 L198,381.115 L194,428.099 L6,428.099 A0,0 0 0 0 6,428.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M379.743,428.099 L379.743,438.099 L389.743,438.099 L379.743,428.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="445.292" fill="#000" font-size="13" textLength="312.152" font-family="Arial">Sem reabertura ou exclusão previstas para este MVP.</text><text x="12" y="460.241" fill="#000" font-size="13" textLength="343.973" font-family="Arial">Fechar não valida nem cancela os lançamentos vinculados.</text><text x="12" y="475.19" fill="#000" font-size="13" textLength="327.298" font-family="Arial">Proposta: admitir correções dos registros existentes sem</text><text x="12" y="490.139" fill="#000" font-size="13" textLength="362.743" font-family="Arial">trocar o vínculo fechado, conforme permissões do lançamento.</text><text x="12" y="505.087" fill="#000" font-size="13" textLength="344.684" font-family="Arial">Compartilhar bloqueio transacional com novos lançamentos</text><text x="12" y="520.036" fill="#000" font-size="13" textLength="308.572" font-family="Arial">para evitar gravação concorrente após o fechamento.</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-link-type="dependency"><polygon points="413,156.885,417,147.885,413,151.885,409,147.885,413,156.885" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M413,73.325 C413,91.888 413,124.635 413,151.885" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="476.779" y="105.292" fill="#000" font-size="13" textLength="101.893" font-family="Arial">cadastrar fornada</text><text x="415" y="120.241" fill="#000" font-size="13" textLength="225.45" font-family="Arial">[Gestor de Produção ou Administrador]</text><text x="416.444" y="135.19" fill="#000" font-size="13" textLength="222.562" font-family="Arial">/ vincular unidade; registrar aberta_em</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-link-type="dependency"><polygon points="206.444,316.016,213.076,308.735,208.019,311.27,205.483,306.214,206.444,316.016" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M278.863,222.169 C269.251,227.276 260.151,233.208 252,240.099 C228.713,259.784 215.99