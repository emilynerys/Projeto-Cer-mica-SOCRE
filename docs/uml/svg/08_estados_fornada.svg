<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:761px;height:1112px;background:#FFFFFF;" width="761px" height="1112px" viewBox="0 0 761 1112" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="6"><text x="224.012" y="23.132" fill="#000" font-size="14" textLength="306.476" font-weight="700" font-family="Arial">Estados — fornada (ciclo de queima do forno)</text></g><g class="entity" data-qualified-name="Andamento" id="ent0001" data-source-line="8"><path d="M18.5,157.099 L356.971,157.099 A12.5,12.5 0 0 1 369.471,169.599 L369.471,182.047 L6,182.047 L6,169.599 A12.5,12.5 0 0 1 18.5,157.099" fill="#F1F1F1"/><rect x="6" y="157.099" width="363.471" height="548.949" fill="none" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="6" y1="182.047" x2="369.471" y2="182.047" style="stroke:#181818;stroke-width:0.5;"/><text x="143.654" y="174.292" fill="#000" font-size="13" textLength="88.163" font-family="Arial">Em andamento</text><g class="entity" data-qualified-name="Andamento.Enfornando" id="ent0002" data-source-line="9"><rect x="12" y="254.047" width="319.736" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="12" y1="278.996" x2="331.736" y2="278.996" style="stroke:#181818;stroke-width:0.5;"/><text x="138.257" y="271.241" fill="#000" font-size="13" textLength="67.222" font-family="Arial">Enfornando</text><text x="17" y="296.19" fill="#000" font-size="13" textLength="299.736" font-family="Arial">Aceita Enforna até a marcação "Enforna concluída".</text></g><g class="entity" data-qualified-name="Andamento.Esquente" id="ent0003" data-source-line="10"><rect x="20.5" y="373.047" width="302.572" height="64.846" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="20.5" y1="397.996" x2="323.072" y2="397.996" style="stroke:#181818;stroke-width:0.5;"/><text x="144.32" y="390.241" fill="#000" font-size="13" textLength="54.933" font-family="Arial">Esquente</text><text x="25.5" y="415.19" fill="#000" font-size="13" textLength="282.572" font-family="Arial">Ainda pode aceitar Enforna (outro lado do forno),</text><text x="25.5" y="430.139" fill="#000" font-size="13" textLength="268.823" font-family="Arial">se a Enforna não foi marcada como concluída.</text></g><g class="entity" data-qualified-name="Andamento.Queima" id="ent0004" data-source-line="11"><rect x="37" y="507.047" width="270.041" height="64.846" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="37" y1="531.996" x2="307.041" y2="531.996" style="stroke:#181818;stroke-width:0.5;"/><text x="149.261" y="524.241" fill="#000" font-size="13" textLength="45.519" font-family="Arial">Queima</text><text x="42" y="549.19" fill="#000" font-size="13" textLength="250.041" font-family="Arial">Aceita Desenforna das linhas já queimadas</text><text x="42" y="564.139" fill="#000" font-size="13" textLength="200.922" font-family="Arial">e Enforna, se ainda não concluída.</text></g><g class="entity" data-qualified-name="Andamento.Queimada" id="ent0005" data-source-line="12"><rect x="56" y="641.047" width="232.456" height="50" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="56" y1="665.996" x2="288.456" y2="665.996" style="stroke:#181818;stroke-width:0.5;"/><text x="142.239" y="658.241" fill="#000" font-size="13" textLength="59.979" font-family="Arial">Queimada</text><text x="61" y="683.19" fill="#000" font-size="13" textLength="212.456" font-family="Arial">Aceita Desenforna até a última linha.</text></g><g class="start_entity" data-qualified-name="Andamento..start.Andamento" id="ent0007" data-source-line="13"><ellipse cx="172" cy="203.047" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="172,253.772,176,244.772,172,248.772,168,244.772,172,253.772" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M172,217.297 C172,227.027 172,236.431 172,248.772" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk9" data-link-type="dependency"><polygon points="172,372.607,176,363.607,172,367.607,168,363.607,172,372.607" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M172,304.052 C172,323.555 172,346.234 172,367.607" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="184.829" y="336.241" fill="#000" font-size="13" textLength="156.813" font-family="Arial">registrar início do esquente</text><text x="174" y="351.19" fill="#000" font-size="13" textLength="178.471" font-family="Arial">[Registro de Produção] (RN21)</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk10" data-link-type="dependency"><polygon points="172,506.731,176,497.731,172,501.731,168,497.731,172,506.731" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M172,438.165 C172,458.911 172,480.945 172,501.731" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="190.256" y="470.241" fill="#000" font-size="13" textLength="145.958" font-family="Arial">registrar início da queima</text><text x="174" y="485.19" fill="#000" font-size="13" textLength="178.471" font-family="Arial">[Registro de Produção] (RN21)</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-link-type="dependency"><polygon points="172,640.835,176,631.835,172,635.835,168,631.835,172,640.835" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M172,572.286 C172,593.611 172,616.282 172,635.835" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="196.766" y="604.241" fill="#000" font-size="13" textLength="132.939" font-family="Arial">registrar fim da queima</text><text x="174" y="619.19" fill="#000" font-size="13" textLength="178.471" font-family="Arial">[Registro de Produção] (RN21)</text></g></g><g class="entity" data-qualified-name="Concluida" id="ent0006" data-source-line="18"><rect x="68.5" y="790.099" width="238.245" height="64.846" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="68.5" y1="815.047" x2="306.745" y2="815.047" style="stroke:#181818;stroke-width:0.5;"/><text x="158.354" y="807.292" fill="#000" font-size="13" textLength="58.538" font-family="Arial">Concluída</text><text x="73.5" y="832.241" fill="#000" font-size="13" textLength="218.245" font-family="Arial">Indisponível para novos lançamentos.</text><text x="73.5" y="847.19" fill="#000" font-size="13" textLength="195.813" font-family="Arial">Preserva lançamentos e histórico.</text></g><g class="start_entity" data-qualified-name=".start." id="ent0012" data-source-line="20"><ellipse cx="187.5" cy="59.099" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0015" data-source-line="22"><ellipse cx="83.5" cy="993.099" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="83.5" cy="993.099" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN17" id="ent0018" data-source-line="34"><path d="M387.5,337.099 L387.5,427.599 L369.228,431.599 L387.5,435.599 L387.5,526.483 A0,0 0 0 0 387.5,526.483 L745.3,526.483 A0,0 0 0 0 745.3,526.483 L745.3,347.099 L735.3,337.099 L387.5,337.099 A0,0 0 0 0 387.5,337.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M735.3,337.099 L735.3,347.099 L745.3,347.099 L735.3,337.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="393.5" y="354.292" fill="#000" font-size="13" textLength="278.954" font-family="Arial">O forno não precisa estar cheio para o esquente</text><text x="393.5" y="369.241" fill="#000" font-size="13" textLength="192.188" font-family="Arial">ou a queima começarem (RN21).</text><text x="393.5" y="384.19" fill="#000" font-size="13" textLength="316.526" font-family="Arial">Duração calculada: esquente (cerca de 24 h) e queima</text><text x="393.5" y="399.139" fill="#000" font-size="13" textLength="303.526" font-family="Arial">(1h30 a 2h por linha); velocidade em linhas por 24 h.</text><text x="393.5" y="414.087" fill="#000" font-size="13" textLength="313.644" font-family="Arial">Até duas fornadas em andamento na mesma unidade:</text><text x="393.5" y="429.036" fill="#000" font-size="13" textLength="290.551" font-family="Arial">a anterior sendo desenfornada e a seguinte sendo</text><text x="393.5" y="443.985" fill="#000" font-size="13" textLength="252.199" font-family="Arial">enfornada nas linhas já esvaziadas (RN08).</text><text x="393.5" y="458.934" fill="#000" font-size="13" textLength="329.361" font-family="Arial">"Enforna concluída": marcação do Registro de Produção,</text><text x="393.5" y="473.882" fill="#000" font-size="13" textLength="336.8" font-family="Arial">independente das fases da queima. Depois dela a fornada</text><text x="393.5" y="488.831" fill="#000" font-size="13" textLength="327.228" font-family="Arial">não recebe Enforna, e só então "Nova fornada" aparece.</text><text x="393.5" y="503.78" fill="#000" font-size="13" textLength="332.427" font-family="Arial">Fornadas que já estavam no forno em 13/08/2026 entram</text><text x="393.5" y="518.729" fill="#000" font-size="13" textLength="169.8" font-family="Arial">pelo inventário inicial (RN20).</text></g><g class="entity" data-qualified-name="GMN20" id="ent0021" data-source-line="49"><path d="M112.5,892.099 L112.5,1096.432 A0,0 0 0 0 112.5,1096.432 L470.979,1096.432 A0,0 0 0 0 470.979,1096.432 L470.979,902.099 L460.979,892.099 L233.482,892.099 L207.062,855.48 L225.482,892.099 L112.5,892.099 A0,0 0 0 0 112.5,892.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M460.979,892.099 L460.979,902.099 L470.979,902.099 L460.979,892.099" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="118.5" y="909.292" fill="#000" font-size="13" textLength="258.699" font-family="Arial">Numeração reinicia a cada mês por unidade:</text><text x="118.5" y="924.241" fill="#000" font-size="13" textLength="170.892" font-family="Arial">"2ª fornada de outubro/2026".</text><text x="118.5" y="939.19" fill="#000" font-size="13" textLength="234.121" font-family="Arial">Sem reabertura ou exclusão neste MVP.</text><text x="118.5" y="954.139" fill="#000" font-size="13" textLength="333.855" font-family="Arial">Concluir não valida nem cancela lançamentos vinculados.</text><text x="118.5" y="969.087" fill="#000" font-size="13" textLength="331.709" font-family="Arial">Conclusão manual (decidido em 12/10): quando as linhas</text><text x="118.5" y="984.036" fill="#000" font-size="13" textLength="337.479" font-family="Arial">desenfornadas alcançam as enfornadas, o sistema sugere</text><text x="118.5" y="998.985" fill="#000" font-size="13" textLength="311.302" font-family="Arial">"Concluir a fornada?". Não conclui sozinho, porque as</text><text x="118.5" y="1013.934" fill="#000" font-size="13" textLength="307.874" font-family="Arial">linhas são contadas no olho e o Cru que fica no forno</text><text x="118.5" y="1028.882" fill="#000" font-size="13" textLength="192.251" font-family="Arial">é recontado na Enforna seguinte.</text><text x="118.5" y="1043.831" fill="#000" font-size="13" textLength="296.981" font-family="Arial">Na conclusão, o sistema mostra a diferença entre o</text><text x="118.5" y="1058.78" fill="#000" font-size="13" textLength="321.604" font-family="Arial">enfornado e o desenfornado, para mais ou para menos,</text><text x="118.5" y="1073.729" fill="#000" font-size="13" textLength="282.49" font-family="Arial">sem exigir justificativa (estimativa, quebras e Cru</text><text x="118.5" y="1088.677" fill="#000" font-size="13" textLength="112.017" font-family="Arial">que ficou no forno).</text></g><g class="link" data-entity-1="ent0012" data-entity-2="ent0001" id="lnk13" data-link-type="dependency"><polygon points="187.5,156.988,191.5,147.988,187.5,151.988,183.5,147.988,187.5,156.988" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M187.5,73.127 C187.5,88.755 187.5,114.64 187.5,151.988" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="227.008" y="105.292" fill="#000" font-size="13" textLength="197.26" font-family="Arial">primeira Enforna de um novo ciclo</text><text x="189.5" y="120.241" fill="#000" font-size="13" textLength="272.276" font-family="Arial">[Registro de Produção escolhe "Nova fornada"]</text><text x="204.249" y="135.19" fill="#000" font-size="13" textLength="242.779" font-family="Arial">/ gerar número sequencial do mês (RN06)</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk14" data-link-type="dependency"><polygon points="187.5,789.626,191.5,780.626,187.5,784.626,183.5,780.626,187.5,789.626" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M187.5,706.202 C187.5,739.334 187.5,763.775 187.5,784.626" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="291.742" y="738.292" fill="#000" font-size="13" textLength="44.795" font-family="Arial">concluir</text><text x="225.625" y="753.241" fill="#000" font-size="13" textLength="177.03" font-family="Arial">[Gestor de Produção confirma]</text><text x="189.5" y="768.19" fill="#000" font-size="13" textLength="249.279" font-family="Arial">/ registrar concluída_em e auditoria (RN08)</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0015" id="lnk16" data-link-type="dependency"><polygon points="83.317,981.916,87.396,972.952,83.361,976.916,79.397,972.881,83.317,981.916" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M137.035,855.395 C124.335,865.66 111.932,878.066 103.5,892.099 C86.099,921.057 83.535,957.308 83.361,976.916" style="stroke:#181818;stroke-width:1;" fill="none"/></g><?plantuml-src bLLDZnj54BtFhoXyMYF7w_MYA38IQ9KFn06p91ANP8LgPzfsXvbkqzrZaaL8_0Z-GCGX8b9EkUN8_1D-2Q-wvykhHOAJFTDTzLwzUbNpoTxnjc8g-RMj0_bA1JQS-H-rsRFZYloE2_kpDblQSEdLwAHG6wxByCIQiEPAqONJNDvz_apVA3exptQwKAIgVNYDKvyxlG_QcYpeK2fwx0EWFFtzs--qiSvmmNIIwxoqk4m_rKg3Ps7ZcPrc6Qu7HPF75R4fGC04Eo7sTD4zqIyPKNVBn9IcI7U6nz4L3mmJLBhGFWp7tqK2yJ3zlNrKZ0yBENx-wHNTk_V5CThmaCvQ85gHKrljWsD7sZJlSssbMjMUlp3FdwRpACUbiqNTl6t-i5TqydIzF9jAwYwN94uyxaxBhPp_9McRPqXP72VTwEh_9Forwzj3Q_AoRjwtigL73TsoJhQXaIlQErqfxRYJJxBN5Hbxi1Gzyg_8K32tvGw8QtlWpbcJgnVcbBPAAZ3DnqeXp2kHBuUBHVYgUUU5zEB-D1kO2A-UAdZbwRy3_5VA1-jkWUDyert54MuGBU-B_q5Lf8ZhGYDOSqHyCCq634648basCiwABdAbmw06X-PFOghOvPo0EyUFe2RpREIs2usYQ6_1bsCorsSxmIg07YN6SHYusJZO8wY_RWHlOtM2BmIoiYFSUTPxiQNzI7dLzH6zBxNPuUTbywQr4LuECQe3caNOIDkqsjv2AEx6QDLfFfP1KaQuUJPkuzUcq7vlCHy7LPBihsWjK6FJl4szzySXbmu0xi17Lq1sXnOt7vpExJpBZ8LSJcztWUncC3J6wjiaQwfaxrIkFSEgqePyfp2aaSGm_mYnDNLp9X8he3gu9mtM71SUrQxjVivbNgD_lEeJO9Sgj4VykVoCTbFgTYe2JyvsvmiaN-vW29S4cdvEqCBcg3OkxQvBSa4I2E2525lKUDkEbPUB_JecQ5yf3xgrYMbMY44xmCPff463n65zew2h-CghRQs5SJn7o71iZjsY_85lTCHDSoEaxdB-QZmQmBnxLSmG3NkfFN2ZP99umrxvOSFDOQozrNYZIfJI5Ox8s4aqKbsF78iYcWye8CIPFDf0n6WnhWld9vry06ah2tnWMN2jJw3hsVdfui7fSh6yBmdnYKNW7Yq2vuCWl86e-A_Z1XDNBA07IY5nOUl5Qnk2hSICmy8bMjTOWAqwJgKKg2qESzo3qlHH3oVBlzxrtsX8Y7rHNpiRkKsadcUWwnHVAnTgiN5DwXNGl00OrARec-ylvMBBmYNr3bpAS1b4vsnoKVXekWxQH5lBB7QnCMV5ffQY2ynHeOiar_BqR35TGTAuCtld879iEK-ObGGYTuRtCqoVXqiK_EjhV2fa1YSzuRwHNqxcj1xsaIPlRm1aPwAQz3D2jgxrxSKGaT5NV9h05b0FNHsxlz4vzsr782OCBeaHSQ0wTtTJ8agiExDB-Z7loiht1bmBlK41KcNq3W17SvK8Z4GHxh9-AeRHqRpqe8prCY9UFbclz1OYlAnzqC8uQ3Zx19t5YCZ_cTHoxKHGgGnHRMt8rXKtSkS_?></g></svg>